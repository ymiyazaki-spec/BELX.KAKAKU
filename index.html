<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>仲卸・バイヤー価格提案システム</title>
  <style>
    :root { --p: #2c3e50; --s: #3498db; --ok: #27ae60; --ng: #e74c3c; --bg: #f4f6f8; }
    body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 12px; color: #333; }
    h1 { font-size: 16px; text-align: center; color: var(--p); margin: 4px 0 12px; }
    .tabs { display: flex; gap: 4px; margin-bottom: 12px; background: #ddd; padding: 3px; border-radius: 8px; }
    .tab { flex: 1; padding: 8px 2px; text-align: center; font-size: 12px; font-weight: bold; background: none; border: none; border-radius: 6px; cursor: pointer; }
    .tab.active { background: #fff; color: var(--p); }
    .card { background: #fff; border-radius: 8px; padding: 12px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    .card-title { font-size: 14px; font-weight: bold; margin-bottom: 8px; border-bottom: 2px solid var(--s); padding-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
    label { display: block; font-size: 11px; font-weight: bold; color: #666; margin-top: 6px; }
    input, select { width: 100%; padding: 6px 8px; font-size: 13px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; margin-top: 2px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .btn { width: 100%; padding: 8px; border: none; border-radius: 4px; font-weight: bold; font-size: 12px; cursor: pointer; margin-top: 8px; }
    .btn-s { background: var(--s); color: #fff; }
    .btn-ok { background: var(--ok); color: #fff; }
    .btn-ng { background: var(--ng); color: #fff; }
    .btn-del { background: #95a5a6; color: #fff; border: none; border-radius: 4px; padding: 3px 8px; font-size: 11px; cursor: pointer; }
    .btn-del:active { background: #7f8c8d; }
    .item-card { border: 1px solid #eee; border-radius: 6px; padding: 10px; margin-bottom: 8px; background: #fff; }
    .badge { display: inline-block; padding: 2px 6px; border-radius: 10px; font-size: 10px; color: #fff; font-weight: bold; }
    .bg-ok { background: var(--ok); }
    .bg-ng { background: var(--ng); }
    .bg-wait { background: #f39c12; }
    .sav-box { background: #eef9f1; border: 1px solid var(--ok); border-radius: 6px; padding: 8px; text-align: center; margin-bottom: 12px; font-size: 12px; }
    .sav-val { font-size: 18px; font-weight: bold; color: var(--ok); }
    .act-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top: 6px; }
    .diff-group { display: flex; gap: 4px; margin-top: 4px; }
    table { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 6px; }
    th, td { border: 1px solid #ddd; padding: 5px; text-align: left; }
    th { background: #eee; }
    .done { background: #e8f8f5; color: #888; text-decoration: line-through; }
    .view { display: none; }
    .view.active { display: block; }
  </style>
</head>
<body>

  <h1>仲卸・バイヤー価格提案システム</h1>

  <div class="tabs">
    <button class="tab active" onclick="showView('sup')">① 仲卸担当</button>
    <button class="tab" onclick="showView('buy')">② バイヤー判定</button>
    <button class="tab" onclick="showView('clk')">③ 事務員確認</button>
  </div>

  <!-- 画面①：仲卸 -->
  <div id="v-sup" class="view active">
    <div class="card">
      <div class="card-title">
        <span>新規提案</span>
        <select id="s-user" style="width:auto;" onchange="renderSup()">
          <option value="Aさん">担当: Aさん</option>
          <option value="Bさん">担当: Bさん</option>
          <option value="Cさん">担当: Cさん</option>
        </select>
      </div>
      <label>商品名</label><input type="text" id="p-name" placeholder="例: サンふじ">
      <div class="grid">
        <div><label>産地/規格</label><input type="text" id="p-spec" placeholder="青森/28玉"></div>
        <div><label>提案単価(円)</label><input type="number" id="p-price" placeholder="3500"></div>
      </div>
      <label>限定数量</label><input type="text" id="p-qty" placeholder="例: 50ケース">
      <button class="btn btn-s" onclick="addProposal()">提案を送信</button>
    </div>
    <div class="card">
      <div class="card-title">自分の提案履歴</div>
      <div id="sup-list"></div>
    </div>
  </div>

  <!-- 画面②：バイヤー -->
  <div id="v-buy" class="view">
    <div class="sav-box">差額貯金残高: <span class="sav-val" id="sav-val">￥0</span></div>
    <div class="card">
      <div class="card-title">未判定の提案</div>
      <div id="buy-list"></div>
    </div>
  </div>

  <!-- 画面③：事務員 -->
  <div id="v-clk" class="view">
    <div class="card">
      <div class="card-title">本日確定データ一覧</div>
      <table>
        <thead><tr><th>転記</th><th>担当</th><th>商品/規格</th><th>確定単価</th><th>貯金差額</th></tr></thead>
        <tbody id="clk-list"></tbody>
      </table>
    </div>
  </div>

  <script>
    let list = JSON.parse(localStorage.getItem('b2b_p')) || [
      { id:'1', user:'Aさん', name:'サンふじ', spec:'青森/28玉', price:3200, qty:'30箱', status:'wait', finalPrice:0, diff:0, done:false },
      { id:'2', user:'Bさん', name:'完熟マンゴー', spec:'宮崎/2L', price:5800, qty:'10箱', status:'wait', finalPrice:0, diff:0, done:false }
    ];
    let savings = parseInt(localStorage.getItem('b2b_s')) || 15000;

    function save() {
      localStorage.setItem('b2b_p', JSON.stringify(list));
      localStorage.setItem('b2b_s', savings.toString());
      document.getElementById('sav-val').innerText = '￥' + savings.toLocaleString();
    }

    function showView(v) {
      document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', (v==='sup'&&i===0)||(v==='buy'&&i===1)||(v==='clk'&&i===2)));
      document.querySelectorAll('.view').forEach(e => e.classList.remove('active'));
      document.getElementById('v-' + v).classList.add('active');
      if(v==='sup') renderSup();
      if(v==='buy') renderBuy();
      if(v==='clk') renderClk();
    }

    function addProposal() {
      const name = document.getElementById('p-name').value;
      const price = parseInt(document.getElementById('p-price').value) || 0;
      if(!name || !price) return alert('商品名と単価を入力してください');
      
      list.unshift({
        id: Date.now().toString(),
        user: document.getElementById('s-user').value,
        name, spec: document.getElementById('p-spec').value,
        price, qty: document.getElementById('p-qty').value,
        status: 'wait', finalPrice: 0, diff: 0, done: false
      });
      save(); renderSup();
      document.getElementById('p-name').value = '';
      document.getElementById('p-price').value = '';
      alert('送信しました！');
    }

    // 削除確認アラート
    function deleteProposal(id) {
      const target = list.find(p => p.id === id);
      if (!target) return;

      const ok = confirm(`【確認】\n「${target.name}（${target.spec}）」の提案を削除してもよろしいですか？\n※この操作は取り消せません。`);
      if (ok) {
        list = list.filter(p => p.id !== id);
        save();
        renderSup();
      }
    }

    function renderSup() {
      const currentUser = document.getElementById('s-user').value;
      const el = document.getElementById('sup-list');
      el.innerHTML = '';
      
      // 選択中の担当者のみ表示（他人の提案は触れない）
      const myProposals = list.filter(p => p.user === currentUser);

      if(!myProposals.length) {
        el.innerHTML = '<div style="font-size:12px;color:#888;text-align:center;padding:12px;">提案はありません</div>';
        return;
      }

      myProposals.forEach(p => {
        let b = '<span class="badge bg-wait">判定待ち</span>';
        if(p.status==='ok') b = `<span class="badge bg-ok">確定(￥${p.finalPrice})</span>`;
        if(p.status==='ng') b = '<span class="badge bg-ng">NG</span>';

        // 判定待ち（未確定）のときだけ削除ボタンを表示
        const delBtn = p.status === 'wait' 
          ? `<button class="btn-del" onclick="deleteProposal('${p.id}')">削除</button>` 
          : '';

        el.innerHTML += `
          <div class="item-card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <strong>${p.name}</strong>
              <div style="display:flex; align-items:center; gap:6px;">
                ${b}
                ${delBtn}
              </div>
            </div>
            <div style="font-size:11px;color:#666;margin-top:4px;">
              ${p.spec} | ￥${p.price.toLocaleString()} (${p.qty})
            </div>
          </div>
        `;
      });
    }

    function renderBuy() {
      document.getElementById('sav-val').innerText = '￥' + savings.toLocaleString();
      const el = document.getElementById('buy-list');
      el.innerHTML = '';
      const waits = list.filter(p => p.status === 'wait');
      if(!waits.length) return el.innerHTML = '<div style="font-size:12px;color:#888;text-align:center;padding:16px;">未判定の提案はありません</div>';
      
      waits.forEach(p => {
        el.innerHTML += `<div class="item-card">
          <div style="font-size:10px;color:var(--s);font-weight:bold;">担当: ${p.user}</div>
          <strong>${p.name}</strong> (${p.spec})
          <div style="font-size:12px;">提案単価: <strong>￥${p.price.toLocaleString()}</strong> / ${p.qty}</div>
          <div class="act-btns">
            <button class="btn btn-ok" style="margin:0;" onclick="judge('${p.id}','ok')">そのままOK</button>
            <button class="btn btn-ng" style="margin:0;" onclick="judge('${p.id}','ng')">NG</button>
          </div>
          <div class="diff-group">
            <input type="number" id="df-${p.id}" placeholder="差額(円)">
            <button class="btn btn-s" style="margin:0;width:60px;" onclick="judge('${p.id}','add')">+乗せる</button>
            <button class="btn" style="margin:0;width:60px;border:1px solid #888;" onclick="judge('${p.id}','sub')">-使う</button>
          </div>
        </div>`;
      });
    }

    function judge(id, type) {
      const p = list.find(x => x.id === id);
      const df = parseInt(document.getElementById(`df-${id}`)?.value) || 0;
      if(type === 'ok') { p.status = 'ok'; p.finalPrice = p.price; }
      else if(type === 'ng') { p.status = 'ng'; }
      else if(type === 'add') {
        if(df <= 0) return alert('金額を入力してください');
        p.status = 'ok'; p.finalPrice = p.price + df; p.diff = df; savings += df;
      } else if(type === 'sub') {
        if(df <= 0 || df > savings) return alert('貯金残高を確認してください');
        p.status = 'ok'; p.finalPrice = p.price - df; p.diff = -df; savings -= df;
      }
      save(); renderBuy();
    }

    function renderClk() {
      const el = document.getElementById('clk-list');
      el.innerHTML = '';
      const oks = list.filter(p => p.status === 'ok');
      if(!oks.length) return el.innerHTML = '<tr><td colspan="5" style="text-align:center;">確定データはありません</td></tr>';
      oks.forEach(p => {
        el.innerHTML += `<tr class="${p.done ? 'done' : ''}">
          <td style="text-align:center;"><input type="checkbox" ${p.done?'checked':''} onchange="toggleDone('${p.id}')"></td>
          <td>${p.user}</td>
          <td><strong>${p.name}</strong><br><span style="font-size:9px;color:#666;">${p.spec}</span></td>
          <td>￥${p.finalPrice.toLocaleString()}</td>
          <td>${p.diff > 0 ? '+￥'+p.diff : (p.diff < 0 ? '-￥'+Math.abs(p.diff) : '0')}</td>
        </tr>`;
      });
    }

    function toggleDone(id) {
      const p = list.find(x => x.id === id);
      if(p) { p.done = !p.done; save(); renderClk(); }
    }

    renderSup();
  </script>
</body>
</html>
